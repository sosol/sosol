# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will download a prebuilt Ruby version, install dependencies and run tests with Rake
# For more information see: https://github.com/marketplace/actions/setup-ruby-jruby-and-truffleruby

name: Rails Tests

on: [push, pull_request]

jobs:
  test:
    env:
      RAILS_ENV: test
      BUNDLE_GEMFILE: Gemfile.${{ matrix.ruby }}
      DATABASE_URL: postgresql://sosol_test@localhost:5432/sosol_test?pool=16
      PGPASSWORD: sosol_test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: sosol_test
          POSTGRES_USER: sosol_test
          POSTGRES_PASSWORD: sosol_test
        options:
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', 'jruby-10.0.6.0']
    steps:
    - uses: actions/checkout@v3
    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev git libgit2-dev libssl-dev libyaml-dev libreadline6-dev zlib1g-dev libncurses5-dev libffi-dev libgdbm6 libgdbm-dev pkg-config libpq-dev sendmail rsync libgit2-fixtures libz3-dev libzstd-dev pkgconf cmake build-essential libssh2-1-dev
    - name: Configure sysctl limits
      run: |
        sudo swapoff -a
        sudo sysctl -w fs.inotify.max_user_watches=524288
        sudo sysctl -w vm.swappiness=1
        sudo sysctl -w fs.file-max=262144
        sudo sysctl -w vm.max_map_count=262144
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true # runs 'bundle install' and caches installed gems automatically
    - name: Configure externals
      run: bundle exec cap local externals:setup
    - name: Clone canonical
      run: bundle exec rake git:db:canonical:clone
    - name: DB reset
      run: bundle exec rake db:reset
    - name: DB migrate
      run: bundle exec rake db:migrate
    - name: Run tests
      run: bundle exec rake test:all
    - name: Upload test logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: logs-${{ matrix.runs-on }}-${{ matrix.ruby }}
        path: log
        retention-days: 1
    - name: Upload rugged build logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rugged-logs-${{ matrix.runs-on }}-${{ matrix.ruby }}
        path: /home/runner/work/sosol/sosol/vendor/bundle/ruby/3.2.0/extensions/x86_64-linux/3.2.0/rugged-1.9.0
        retention-days: 1
